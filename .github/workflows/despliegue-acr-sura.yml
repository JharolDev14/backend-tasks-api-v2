name: Build and Push to ACR

on:
  push:
    branches:
      - main
      - develop

env:
  ACR_NAME: crsuradev
  REGISTRY: crsuradev.azurecr.io
  IMAGE_NAME: backend-tasks-api-v2
  IMAGE_TAG: sura.v1

  AZURE_TENANT_ID: 9dbc76ea-fb25-4b07-8f07-5dc315999b76
  AZURE_SUBSCRIPTION_ID: f0550323-fb0b-44d4-8a39-ecf0f6c2dbc9

  AKS_RESOURCE_GROUP: RG-PRY-SURA-PLF-ENGINEERING
  AKS_CLUSTER_NAME: aks-sura-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "$AZURE_TENANT_ID"

      - name: List Available Subscriptions
        run: |
          echo "===== AVAILABLE SUBSCRIPTIONS ====="
          az account list -o table

      - name: Select Subscription
        run: |
          echo "===== SELECTING SUBSCRIPTION ====="
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Validate Current Subscription
        run: |
          echo "===== CURRENT SUBSCRIPTION ====="
          az account show -o table

      - name: List ACRs in Selected Subscription
        run: |
          echo "===== ACRs IN CURRENT SUBSCRIPTION ====="
          az acr list -o table

      - name: Validate Azure Container Registry
        run: |
          echo "===== VALIDATING ACR ====="
          az acr show --name "$ACR_NAME" -o table

      - name: Login to Azure Container Registry
        run: |
          echo "===== LOGIN TO ACR ====="
          az acr login --name "$ACR_NAME"

      - name: List Repositories
        run: |
          echo "===== ACR REPOSITORIES ====="
          az acr repository list --name "$ACR_NAME" -o table

      - name: Validate Previous Image
        run: |
          echo "===== PREVIOUS IMAGE VALIDATION ====="

          PREVIOUS_DIGEST=$(az acr manifest list-metadata \
            --registry "$ACR_NAME" \
            --name "$IMAGE_NAME" \
            --query "[?tags && contains(tags, '$IMAGE_TAG')].digest | [0]" \
            -o tsv 2>/dev/null || true)

          PREVIOUS_UPDATED_TIME=$(az acr manifest list-metadata \
            --registry "$ACR_NAME" \
            --name "$IMAGE_NAME" \
            --query "[?tags && contains(tags, '$IMAGE_TAG')].lastUpdateTime | [0]" \
            -o tsv 2>/dev/null || true)

          if [ -n "$PREVIOUS_DIGEST" ]; then
            echo "PREVIOUS_IMAGE_STATUS=FOUND" >> "$GITHUB_ENV"
            echo "PREVIOUS_IMAGE=$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_ENV"
            echo "PREVIOUS_DIGEST=$PREVIOUS_DIGEST" >> "$GITHUB_ENV"
            echo "PREVIOUS_UPDATED_TIME=${PREVIOUS_UPDATED_TIME:-N/A}" >> "$GITHUB_ENV"
          else
            echo "PREVIOUS_IMAGE_STATUS=NOT_FOUND" >> "$GITHUB_ENV"
            echo "PREVIOUS_IMAGE=$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_ENV"
            echo "PREVIOUS_DIGEST=N/A" >> "$GITHUB_ENV"
            echo "PREVIOUS_UPDATED_TIME=N/A" >> "$GITHUB_ENV"
          fi

      - name: Build Docker Image
        run: |
          echo "===== BUILDING IMAGE ====="

          docker build \
            --label org.opencontainers.image.authors="$GITHUB_ACTOR" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.created="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --label com.github.actor="$GITHUB_ACTOR" \
            --label com.github.triggering_actor="$GITHUB_TRIGGERING_ACTOR" \
            --label com.github.ref="$GITHUB_REF_NAME" \
            -t "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" .

      - name: Push Docker Image
        run: |
          echo "===== PUSHING IMAGE ====="
          docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

      - name: Validate New Image
        run: |
          echo "===== NEW IMAGE VALIDATION ====="

          NEW_DIGEST=$(az acr manifest list-metadata \
            --registry "$ACR_NAME" \
            --name "$IMAGE_NAME" \
            --query "[?tags && contains(tags, '$IMAGE_TAG')].digest | [0]" \
            -o tsv)

          NEW_UPDATED_TIME=$(az acr manifest list-metadata \
            --registry "$ACR_NAME" \
            --name "$IMAGE_NAME" \
            --query "[?tags && contains(tags, '$IMAGE_TAG')].lastUpdateTime | [0]" \
            -o tsv)

          echo "NEW_IMAGE=$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "NEW_DIGEST=$NEW_DIGEST" >> "$GITHUB_ENV"
          echo "NEW_UPDATED_TIME=$NEW_UPDATED_TIME" >> "$GITHUB_ENV"

  create-namespace:
    name: Create Namespace in AKS
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read

    steps:
      - name: Azure Login
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "$AZURE_TENANT_ID"

      - name: Select Subscription
        run: |
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Generate Namespace Name
        run: |
          REPOSITORY_NAME=$(basename "$GITHUB_REPOSITORY")
          NAMESPACE=$(echo "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]')

          echo "Repository: $REPOSITORY_NAME"
          echo "Namespace: $NAMESPACE"

          echo "NAMESPACE=$NAMESPACE" >> "$GITHUB_ENV"

      - name: Create Namespace If Not Exists
        run: |
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Validate Namespace
        run: |
          echo "===== NAMESPACE VALIDATION ====="
          kubectl get namespace "$NAMESPACE"

      - name: Namespace Summary
        run: |
          echo "========================================="
          echo "AKS Namespace Summary"
          echo "========================================="
          echo "Cluster: $AKS_CLUSTER_NAME"
          echo "Namespace: $NAMESPACE"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "========================================="

          {
            echo "## AKS Namespace Summary"
            echo ""
            echo "- Cluster: \`$AKS_CLUSTER_NAME\`"
            echo "- Namespace: \`$NAMESPACE\`"
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"
